name: Build and deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Regenerate the notebook from tools/build_notebook.py
        run: python tools/build_notebook.py content/spc_to_csv.ipynb

      - name: Commit the regenerated notebook if it changed
        run: |
          if ! git diff --quiet -- content/spc_to_csv.ipynb; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/spc_to_csv.ipynb
            git commit -m "Regenerate notebook from tools/build_notebook.py [skip ci]"
            git push
          fi

      - name: Build the site
        run: jupyter lite build --contents content --output-dir dist

      - name: Add the per-cell Run button
        run: python tools/inject_custom_assets.py dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
